# XcodeGen-Projektbeschreibung. Auf dem Mac: `brew install xcodegen` (einmalig), dann in App/: `xcodegen generate`
# → erzeugt RowCoach.xcodeproj. Das .xcodeproj wird nicht von Hand gepflegt, sondern immer neu erzeugt.
name: RowCoach
options:
  bundleIdPrefix: com.falkue
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Sprache der Texte (bis zum String Catalog alles Deutsch): CFBundleDevelopmentRegion = de, damit Streckentexte
  # und gesprochene Ansagen dieselbe Sprache wie die Oberfläche haben
  developmentLanguage: de
packages:
  RowCoachKit:
    path: RowCoachKit
  # Online-Funktion a (Konto & Synchronisation, docs/SYNC.md): nur Auth, Firestore, App Check – kein Analytics.
  # Firebase wird erst eingerichtet, wenn sich jemand anmeldet (FirebaseBootstrap); ohne plist läuft die App normal.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM wird lokal auf dem Mac gesetzt (Xcode → Signing) oder per Umgebungsvariable:
    DEVELOPMENT_TEAM: ${ROWCOACH_TEAM_ID}
targets:
  RowCoach:
    type: application
    platform: iOS
    sources:
      - path: RowCoach
        # Tonkonserven kommen als Ordnerreferenz (unten), nicht als einzelne Dateien in die Gruppe
        excludes:
          - "Resources/Coach"
          - "Resources/Coach/**"
      # Kartenpakete als Ordnerreferenz: landen unverändert als Courses/… im Bundle
      # (gefüllt von tools/coursebuilder/install_courses.py; Course.scenePath ist relativ zu Courses/)
      - path: Courses
        type: folder
        buildPhase: resources
      # Tonkonserven des Sprachcoachs (tools/coach_audio/render_coach.py → RowCoach/Resources/Coach/de|en/<phraseId>.m4a)
      # als Ordnerreferenz, damit sie im Bundle unter Coach/de/… liegen; fehlt der Ordner, wird er übersprungen
      - path: RowCoach/Resources/Coach
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: RowCoachKit
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseAppCheck
      - package: GoogleSignIn
        product: GoogleSignIn
      # 3D-Ansicht (Scene3D); würden auch automatisch gelinkt, hier zur Klarheit
      - sdk: RealityKit.framework
      - sdk: Metal.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.falkue.RowCoach
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Akzentfarbe Abendorange (Assets.xcassets/AccentColor) für Toggles, Links, Tab-Auswahl
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        CODE_SIGN_ENTITLEMENTS: RowCoach/RowCoach.entitlements
        # Die Build-Phase „Firebase-Konfiguration“ liest App/Firebase/… (optional, nicht im Repo) und ergänzt die
        # gebaute Info.plist; mit Sandbox müsste jede Datei als Eingabe existieren
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # GoogleService-Info.plist je Build-Konfiguration ins Bundle (Debug → App/Firebase/dev → rowcoach-dev,
    # Release → App/Firebase/prod → rowcoach-prod) und URL-Schema für „Mit Google anmelden“ (REVERSED_CLIENT_ID)
    # in die gebaute Info.plist. Fehlt die Datei, läuft die App ohne Konto (Warnung im Build-Protokoll).
    postBuildScripts:
      - name: Firebase-Konfiguration
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${CONFIGURATION}" = "Release" ]; then ENV=prod; else ENV=dev; fi
          SRC="${SRCROOT}/Firebase/${ENV}/GoogleService-Info.plist"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist"
          INFO="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          PB=/usr/libexec/PlistBuddy
          if [ ! -f "$SRC" ]; then
            rm -f "$DST"
            echo "warning: ${SRC} fehlt – App ohne Konto/Synchronisation (docs/SYNC.md)"
            exit 0
          fi
          cp "$SRC" "$DST"
          REV=$($PB -c "Print :REVERSED_CLIENT_ID" "$SRC" 2>/dev/null || true)
          $PB -c "Delete :CFBundleURLTypes" "$INFO" 2>/dev/null || true
          if [ -n "$REV" ]; then
            $PB -c "Add :CFBundleURLTypes array" "$INFO"
            $PB -c "Add :CFBundleURLTypes:0 dict" "$INFO"
            $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$INFO"
            $PB -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string ${REV}" "$INFO"
          else
            echo "warning: ${SRC} ohne REVERSED_CLIENT_ID – „Mit Google anmelden“ aus (plist nach dem Einschalten von Google neu laden)"
          fi
    info:
      path: RowCoach/Info.plist
      properties:
        CFBundleDisplayName: RowCoach
        # Sprachen der App (Deutsch Quelle, Englisch über Localizable.xcstrings/InfoPlist.xcstrings); die Wahl folgt
        # der Systemsprache bzw. der Sprache je App in den iOS-Einstellungen
        CFBundleLocalizations: [de, en]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBluetoothAlwaysUsageDescription: "RowCoach verbindet sich mit dem Rudergerät (Concept2-PM5 oder Bluetooth FTMS) und dem Pulsgurt."
        NSHealthShareUsageDescription: "RowCoach liest Trainings und Puls, um deine Einheiten auszuwerten."
        NSHealthUpdateUsageDescription: "RowCoach speichert deine Rudereinheiten als Training in Apple Health."
        UIBackgroundModes: [bluetooth-central]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationQueriesSchemes: [x-apple-health]
    entitlements:
      path: RowCoach/RowCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    scheme:
      testTargets:
        - package: RowCoachKit/RowCoachKitTests
